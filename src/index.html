<!-- #region Meta -->
<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <!-- #endregion Meta -->

  <body>
    <header class="header">
      <a
        href="#header"
        class="header__link__image"
      >
        <img
          class="logo"
          src="./images//logo.png"
          alt="logo moyo"
        />
      </a>

      <nav>
        <ul class="menu">
          <li class="menu__list">
            <a
              href="#apple"
              class="is-active menu__link"
            >
              Apple
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#samsung"
            >
              Samsung
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="menu__list">
            <a
              href="#laptops&computers"
              class="menu__link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#tablets"
            >
              Tablets
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#photo"
            >
              Photo
            </a>
          </li>
          <li class="menu__list">
            <a
              class="menu__link"
              href="#video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
